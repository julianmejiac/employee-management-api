services:
  mysql:
    image: mysql:8
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db
    ports:
      - "3307:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - employee_mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: employee-backend
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/employee_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: employee-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  employee_mysql_data: