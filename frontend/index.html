<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Employee Management</h1>

<section>
    <h2>Add Employee</h2>
    <form id="employeeForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="lastname" placeholder="Last name" required>
        <input type="date" id="dob" required>
        <input type="number" id="salary" placeholder="Salary" required>
        <button type="submit">Add Employee</button>
    </form>
</section>

<section>
    <h2>Find Employee</h2>
    <input type="number" id="searchId" placeholder="Employee ID">
    <button onclick="findEmployeeById()">Find Employee</button>
    <button onclick="loadEmployees()">Show All Employees</button>
</section>

<section>
    <h2>Update Salary by ID</h2>
    <form id="salaryForm">
        <input type="number" id="id" placeholder="Employee ID">
        <input type="number" id="newSalary" placeholder="Salary" required>
        <button type="submit">Update Salary</button>
    </form>

</section>
<section>
    <h2>Delete Employee by ID</h2>
    <form id="deleteForm">
        <input type="number" id="deleteId" placeholder="Employee ID" required>
        <button type="submit">Delete Employee</button>
    </form>
    <p id="deleteMessage"></p>
</section>

<section>
    <h2>Employees</h2>
    <button onclick="clearTable()">Refresh</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Last Name</th>
            <th>Date of Birth</th>
            <th>Salary</th>

        </tr>
        </thead>
        <tbody id="employeesTable"></tbody>
    </table>
</section>


<script src="app.js"></script>
</body>
</html>
